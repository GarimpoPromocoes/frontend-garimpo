<div class="lojas-grade">
  <button type="button" class="loja-botao" (click)="abrir()">
    <span class="loja-logo-caixa"><img class="loja-logo" src="lojas/whatsapp.svg" alt="WhatsApp" /></span>
    <span class="loja-estado" [class.loja-estado-ok]="conectado()">
      <span class="badge-dot"></span>
      {{ conectado() ? 'Conectado' : 'Conectar' }}
    </span>
  </button>

  <!-- Telegram: mesmo fluxo do WhatsApp — QR Code no modal, a sessao fica salva. -->
  <button type="button" class="loja-botao" (click)="abrirTelegram()">
    <span class="loja-logo-caixa"><img class="loja-logo" src="lojas/telegram.png" alt="Telegram" /></span>
    <span class="loja-estado" [class.loja-estado-ok]="telegramConectado()">
      <span class="badge-dot"></span>
      {{ telegramConectado() ? 'Conectado' : 'Conectar' }}
    </span>
  </button>
</div>
