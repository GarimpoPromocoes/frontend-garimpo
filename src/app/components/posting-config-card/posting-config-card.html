<div class="card">
  <div class="card-header">
    <div>
      <h2>Anti-repetição</h2>
      <p class="card-subtitle">Controla quando um produto já postado pode sair de novo.</p>
    </div>
  </div>

  <div class="grid-2">
    <div class="field">
      <label for="cooldownHoras">Cooldown (horas)</label>
      <input
        id="cooldownHoras"
        type="number"
        min="0"
        max="720"
        [ngModel]="cooldownHoras()"
        (ngModelChange)="cooldownHoras.set($event)"
      />
      <span class="hint">Tempo mínimo antes de repostar o mesmo produto</span>
    </div>
    <div class="field">
      <label for="repostarAposDias">Repostar após (dias)</label>
      <input
        id="repostarAposDias"
        type="number"
        min="0"
        max="90"
        [ngModel]="repostarAposDias()"
        (ngModelChange)="repostarAposDias.set($event)"
      />
      <span class="hint">Depois desse prazo, pode repostar mesmo sem melhora de preço. 0 = nunca reposta sem melhora.</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px">
    <button type="button" class="btn btn-primary" [disabled]="salvando()" (click)="salvar()">
      {{ salvando() ? 'Salvando…' : 'Salvar' }}
    </button>
    @if (mensagem(); as m) {
      <span [class]="m.tipo === 'ok' ? 'ok-text' : 'error-text'">{{ m.texto }}</span>
    }
  </div>
</div>
